<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>부저</title>
<style>
/* 글자 외곽선: -webkit-text-stroke 는 Windows 한글 글꼴에서 획 안쪽에 선이 생겨서 8방향 그림자로 그린다 */
:root {
    --outline:
        -1.5px -1.5px 0 #000, 0 -1.5px 0 #000, 1.5px -1.5px 0 #000,
        -1.5px 0 0 #000, 1.5px 0 0 #000,
        -1.5px 1.5px 0 #000, 0 1.5px 0 #000, 1.5px 1.5px 0 #000;
    --outline-thin:
        -1px -1px 0 #000, 0 -1px 0 #000, 1px -1px 0 #000,
        -1px 0 0 #000, 1px 0 0 #000,
        -1px 1px 0 #000, 0 1px 0 #000, 1px 1px 0 #000;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
}

/* 이름 + 팀 선택 화면 */
#setupScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100%;
    box-sizing: border-box;
    padding: 16px;
}
#nameInput {
    font-size: 1.6em;
    padding: 10px;
    width: 90%;
    max-width: 480px;
    box-sizing: border-box;
}
#teamLabel {
    font-size: 1.3em;
}
#palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 90%;
    max-width: 480px;
}
.swatch {
    aspect-ratio: 1;
    border: none;
    border-radius: 12px;
    font-size: 1em;
    font-weight: bold;
    color: white;
    text-shadow: var(--outline-thin);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.swatch.selected {
    box-shadow: 0 0 0 3px white, 0 0 0 7px black;
    transform: scale(1.05);
}
#saveTeam {
    font-size: 1.6em;
    padding: 10px 24px;
}

/* BUZZER 화면 */
#buzzerScreen {
    display: none;
    height: 100%;
    position: relative;
}
#buzzerButton {
    width: 100vw;
    height: 100vh;
    font-size: 10vw;
    font-weight: bold;
    color: white;
    border: none;
    text-shadow: var(--outline);

    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
#buzzerButton:active {
    filter: brightness(80%);
}
#buzzerTeam   { font-size: 8vw; }
#buzzerName   { font-size: 6vw; }
#buzzerText   { font-size: 12vw; }
#buzzerStatus { font-size: 6vw; min-height: 1.2em; }

/* 팀/이름 변경 버튼, 연결 상태 */
#resetTeam, #connection {
    position: absolute;
    top: 10px;
    font-size: 1.2em;
    padding: 5px 10px;
    background-color: black;
    color: white;
    border: none;
    opacity: 0.7;
}
#resetTeam  { right: 10px; }
#connection { left: 10px; pointer-events: none; font-size: 1em; }
#connection.ok   .dot { color: #4cff6a; }
#connection.fail .dot { color: #ff5a5a; }
</style>
</head>
<body>

<!-- 이름 + 팀 선택 화면 -->
<div id="setupScreen">
    <input type="text" id="nameInput" placeholder="이름을 입력하세요" maxlength="20">
    <div id="teamLabel">팀 선택</div>
    <div id="palette"></div>
    <button id="saveTeam">저장하고 시작</button>
</div>

<!-- BUZZER 화면 -->
<div id="buzzerScreen">
    <button id="buzzerButton">
        <div id="buzzerTeam"></div>
        <div id="buzzerName"></div>
        <div id="buzzerText">도전!</div>
        <div id="buzzerStatus"></div>
    </button>
    <div id="connection"><span class="dot">●</span> <span id="connectionText"></span></div>
    <button id="resetTeam">팀/이름 변경</button>
</div>

<script>
// 팀은 이 10가지 색 중에서 고른다. 팀 이름은 색 이름 + "팀" (예: 빨강팀).
const TEAMS = [
    { name: "빨강", color: "#E53935" },
    { name: "주황", color: "#FB8C00" },
    { name: "노랑", color: "#FDD835" },
    { name: "초록", color: "#43A047" },
    { name: "청록", color: "#00ACC1" },
    { name: "파랑", color: "#1E88E5" },
    { name: "남색", color: "#3949AB" },
    { name: "보라", color: "#8E24AA" },
    { name: "분홍", color: "#EC407A" },
    { name: "갈색", color: "#795548" },
];

// 같은 bangddo.github.io 의 다른 앱과 localStorage 가 겹치지 않도록 키에 접두어를 붙인다.
const KEY = { name: "buzzer.name", team: "buzzer.team", server: "buzzer.serverUrl" };
const TIMEOUT_MS = 3000;
const STATUS_MS = 2000;
const PING_INTERVAL_MS = 20000; // 연결을 데워두어 첫 버저가 연결 맺느라 늦지 않게 한다

const setupScreen = document.getElementById("setupScreen");
const buzzerScreen = document.getElementById("buzzerScreen");
const nameInput = document.getElementById("nameInput");
const palette = document.getElementById("palette");
const buzzerButton = document.getElementById("buzzerButton");
const buzzerTeam = document.getElementById("buzzerTeam");
const buzzerName = document.getElementById("buzzerName");
const buzzerStatus = document.getElementById("buzzerStatus");
const connection = document.getElementById("connection");
const connectionText = document.getElementById("connectionText");
const resetTeamBtn = document.getElementById("resetTeam");

let selectedTeam = null;
let sending = false;
let statusTimer = 0;
let pingTimer = 0;

// 부저 화면의 QR 로 들어오면 ?server=https://xxxx.trycloudflare.com 이 붙어 온다.
// 저장해 두고 주소창에서는 지운다 (새로고침·홈 화면 실행 때도 같은 서버 사용).
(function captureServerFromUrl() {
    const server = new URLSearchParams(location.search).get("server");
    if (server && isAllowedServer(server)) {
        localStorage.setItem(KEY.server, server.replace(/\/+$/, ""));
    }
    if (location.search) {
        history.replaceState(null, "", location.pathname);
    }
})();

// 예전 버전(이름 + 자유 색상)에서 저장한 값은 이름만 가져오고 팀은 다시 고르게 한다.
(function migrateOldSettings() {
    const oldName = localStorage.getItem("buzzer.teamName");
    if (oldName && !localStorage.getItem(KEY.name)) {
        nameInput.value = oldName;
    }
    localStorage.removeItem("buzzer.teamName");
    localStorage.removeItem("buzzer.teamColor");
})();

function isAllowedServer(url) {
    try {
        const u = new URL(url);
        return u.protocol === "https:" || u.hostname === "localhost" || u.hostname === "127.0.0.1";
    } catch {
        return false;
    }
}

function serverUrl(path) {
    const server = localStorage.getItem(KEY.server);
    return server ? `${server}/${path}` : null;
}

function findTeam(name) {
    return TEAMS.find(t => t.name === name) || null;
}

// 팀 팔레트 버튼 만들기
for (const team of TEAMS) {
    const button = document.createElement("button");
    button.className = "swatch";
    button.textContent = team.name;
    button.style.backgroundColor = team.color;
    button.dataset.team = team.name;
    button.onclick = () => selectTeam(team.name);
    palette.appendChild(button);
}

function selectTeam(name) {
    selectedTeam = findTeam(name);
    for (const button of palette.children) {
        button.classList.toggle("selected", button.dataset.team === name);
    }
}

// 저장된 이름·팀이 있으면 BUZZER 화면 표시
if (localStorage.getItem(KEY.name) && findTeam(localStorage.getItem(KEY.team))) {
    showBuzzerScreen();
}

// 저장 버튼 클릭
document.getElementById("saveTeam").onclick = () => {
    const name = nameInput.value.trim();
    if (!name) {
        alert("이름을 입력하세요!");
        return;
    }
    if (!selectedTeam) {
        alert("팀(색)을 고르세요!");
        return;
    }

    localStorage.setItem(KEY.name, name);
    localStorage.setItem(KEY.team, selectedTeam.name);
    showBuzzerScreen();
};

// 손가락을 떼는 순간(click)이 아니라 닿는 순간 바로 보낸다.
buzzerButton.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    buzz();
});

async function fetchWithTimeout(url, options = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally {
        clearTimeout(timer);
    }
}

async function buzz() {
    if (sending) return; // 응답을 기다리는 동안 연타는 무시 (서버도 중복을 걸러냄)
    const url = serverUrl("buzz");
    if (!url) {
        showStatus("서버 주소 없음");
        return;
    }
    const team = findTeam(localStorage.getItem(KEY.team));

    sending = true;
    const started = performance.now();
    try {
        // Content-Type 을 지정하지 않으면(text/plain) 브라우저가 사전 확인(OPTIONS) 요청 없이 바로 보낸다.
        const res = await fetchWithTimeout(url, {
            method: "POST",
            body: JSON.stringify({
                team: `${team.name}팀`,
                name: localStorage.getItem(KEY.name),
                color: team.color
            })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        setConnection("ok", performance.now() - started);
        showStatus(describe(data));
    } catch (err) {
        console.error("Error:", err);
        setConnection("fail");
        showStatus("연결 실패");
    } finally {
        sending = false;
    }
}

function describe(data) {
    if (data.result === "first") return "1등!";
    if (data.result === "late") return `${data.rank}등 (+${(data.behindMs / 1000).toFixed(3)}초)`;
    return "이미 눌렀어요";
}

function showStatus(text) {
    buzzerStatus.textContent = text;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { buzzerStatus.textContent = ""; }, STATUS_MS);
}

// 서버 연결 확인 + 왕복 시간 표시. 주기적으로 불러 연결을 유지한다.
async function ping() {
    const url = serverUrl("ping");
    if (!url) {
        setConnection("none");
        return;
    }
    const started = performance.now();
    try {
        const res = await fetchWithTimeout(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        setConnection("ok", performance.now() - started);
    } catch (err) {
        console.error("Ping error:", err);
        setConnection("fail");
    }
}

function setConnection(state, rttMs) {
    connection.className = state;
    if (state === "ok") {
        connectionText.textContent = `연결됨 · ${Math.round(rttMs)}ms`;
    } else if (state === "fail") {
        connectionText.textContent = "연결 안 됨 · 부저 화면의 QR을 다시 찍어주세요";
    } else {
        connectionText.textContent = "서버 주소 없음 · 부저 화면의 QR을 찍어주세요";
    }
}

function startPinging() {
    clearInterval(pingTimer);
    ping();
    pingTimer = setInterval(() => {
        if (document.visibilityState === "visible") ping();
    }, PING_INTERVAL_MS);
}

// 다른 앱을 보다가 돌아오면 바로 연결을 다시 확인한다.
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && buzzerScreen.style.display === "block") ping();
});

// 팀/이름 변경 버튼 클릭
resetTeamBtn.onclick = () => {
    if (confirm("팀이나 이름을 변경하시겠습니까?")) {
        nameInput.value = localStorage.getItem(KEY.name) || "";
        selectTeam(localStorage.getItem(KEY.team));
        localStorage.removeItem(KEY.name);
        localStorage.removeItem(KEY.team);
        clearInterval(pingTimer);
        setupScreen.style.display = "flex";
        buzzerScreen.style.display = "none";
    }
};

function showBuzzerScreen() {
    const team = findTeam(localStorage.getItem(KEY.team));

    buzzerTeam.textContent = `${team.name}팀`;
    buzzerName.textContent = localStorage.getItem(KEY.name); // textContent: 이름에 HTML이 섞여도 안전
    buzzerStatus.textContent = "";
    buzzerButton.style.backgroundColor = team.color;
    setupScreen.style.display = "none";
    buzzerScreen.style.display = "block";
    startPinging();
}
</script>
</body>
</html>
