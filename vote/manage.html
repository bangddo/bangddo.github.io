<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투표 관리</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>투표 관리</h1>
    <div>
      <a class="nav-link" href="./index.html">유권자 화면</a>
      <span id="user-info" class="text-muted hidden" style="margin-left: 12px;"></span>
      <button id="logout-btn" class="btn-secondary btn-sm hidden" style="margin-left: 8px;">로그아웃</button>
    </div>
  </header>

  <main>
    <div id="message-area"></div>

    <section id="login-section" class="panel hidden" style="max-width: 400px; margin: 40px auto;">
      <h2>관리자 로그인</h2>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="login-email" autocomplete="username">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="login-password" autocomplete="current-password">
      </div>
      <div id="login-error" class="message error hidden"></div>
      <button id="login-submit" class="btn-primary" style="width: 100%;">로그인</button>
    </section>

    <section id="signup-section" class="panel hidden" style="max-width: 400px; margin: 40px auto;">
      <h2>관리자 가입</h2>
      <p class="text-muted">초대 코드 <code id="signup-code-display"></code> 으로 가입을 진행합니다.</p>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="signup-email" autocomplete="username">
      </div>
      <div class="form-group">
        <label>비밀번호 (6자리 이상)</label>
        <input type="password" id="signup-password" autocomplete="new-password">
      </div>
      <div id="signup-error" class="message error hidden"></div>
      <button id="signup-submit" class="btn-primary" style="width: 100%;">가입 신청</button>
    </section>

    <section id="pending-section" class="panel hidden" style="max-width: 480px; margin: 40px auto;">
      <h2>승인 대기 중</h2>
      <p>관리자가 가입을 승인하면 자동으로 입장됩니다. 이 화면을 닫지 마세요.</p>
      <p class="text-muted">계정: <code id="pending-email"></code></p>
      <div class="button-row">
        <button id="pending-cancel" class="btn-secondary">가입 취소</button>
      </div>
    </section>

    <section id="manage-section" class="manage-layout hidden">
      <div class="sidebar">
        <div class="button-row mb-4">
          <button id="new-vote-btn" class="btn-primary btn-sm" style="width: 100%;">+ 새 투표 등록</button>
        </div>
        <h2>투표 목록</h2>
        <div id="vote-list" class="vote-list"></div>
        <div id="list-empty" class="text-muted">등록된 투표가 없습니다.</div>

        <h2 style="margin-top:24px;">관리자 관리</h2>
        <button id="open-admin-panel" class="btn-secondary btn-sm" style="width: 100%;">관리자/초대 코드 열기</button>
      </div>
      <div class="panel">
        <div id="panel-content">
          <p class="text-muted">왼쪽에서 투표를 선택하거나 새로 등록하세요.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-root"></div>

  <script type="module" src="./js/manage.js"></script>
</body>
</html>
